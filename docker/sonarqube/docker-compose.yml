# SonarQube Community for the v5 tool baselines. See README.md in this folder.
# The scanner is not a service: scripts/tool_metrics_v5.py runs sonarsource/sonar-scanner-cli per scan.
services:
  sonarqube:
    image: sonarqube:community
    container_name: ai-guardian-sonarqube
    ports:
      - "9000:9000"
    environment:
      # The embedded H2 database is enough for throwaway per-PR projects (each is deleted after reading).
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    mem_limit: 4g

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
